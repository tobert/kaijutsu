# Mouse-wheel scroll sensitivity — the app's scroll feel.
# (docs/config-crdt-ownership.md "Per-client config".)
#
# This is the shared client default (/etc/client/scroll.toml). A specific
# client overrides it at /etc/client/<client-id>/scroll.toml; the app reads
# its own first, then falls back here, then to this compiled-in default.

# Multiplier for winit Line-unit events (notched wheels / X11): px per notch.
# 60 = three text lines per detent — the convention browsers and terminals
# share (retuned with Amy's MX Master 4, 2026-08-16; 40 read as "slow clicks
# do nothing").
line_gain = 60.0

# Multiplier for winit Pixel-unit events (Wayland high-res wheels /
# touchpads), applied AFTER converting the physical-px delta to logical px.
pixel_gain = 3.0

# Exponential easing rate (per second) for smooth wheel scrolling; higher =
# snappier glide. Applied as t = 1 - exp(-smooth_speed * dt), which is
# frame-rate independent (see view::scroll::ease_t) — unlike the old
# (dt * speed).min(1.0) form, splitting one frame into several doesn't change
# the net motion. 83.18 = -60 * ln(0.25): it reproduces the t=0.75-at-60Hz
# feel that 45.0 gave under the old (frame-rate-dependent) form, which is
# where the original tuning-with-Amy (MX Master 3) session happened.
smooth_speed = 83.18
