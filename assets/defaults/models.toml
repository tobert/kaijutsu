# Kaijutsu Model Configuration
#
# Defines available LLM providers, model aliases, and embedding settings.
# API keys are read from the environment or a key file, never stored inline.
#
# Provider fields:
#   enabled         - Whether this provider is available
#   api_key_env     - Environment variable containing the API key
#   api_key_file    - Path to a file holding the key (trimmed; ~ expanded),
#                     e.g. "~/.deepseek-key". Tried before the env var; lets
#                     the kernel read credentials without them living in its
#                     process environment.
#   base_url        - Optional custom endpoint (for local/proxy servers)
#   key_optional    - Register even with no resolvable API key, using a
#                     placeholder value. For gateways where auth is network
#                     identity rather than a bearer token.
#   default_model   - Model to use when not specified
#   max_output_tokens - Maximum RESPONSE tokens (optional). Do not confuse
#                     this with a model's context window (below) — it's a
#                     different number: the output cap, not the total
#                     input+output budget.
#   default_tools   - Tool filter: { type = "all" } | { type = "allow", tools = [...] } | { type = "deny", tools = [...] }
#
# Per-model context window: [providers.<name>.models.<model-id>]
#   context_window  - Total context window (input + output) in tokens, for
#                     the "how much context is left" indicator. A provider
#                     often serves several models with different windows, so
#                     this is nested per-model rather than living as a flat
#                     provider-level field.
#
#                     Leave a model out of this table (or its context_window
#                     unset) when you don't want to hand-pin it — this value
#                     is always an OVERRIDE, checked first. For Anthropic
#                     models specifically, an entry left unset falls through
#                     to a live `GET /v1/models/{id}` lookup (cached) before
#                     landing on "unknown"; every other provider stays
#                     config-only, so leaving one of THOSE unset really does
#                     mean unknown until someone fills it in. Either way, the
#                     resolver never guesses — a fabricated denominator would
#                     make a "% of context used" gauge confidently wrong,
#                     which is worse than the gauge saying "unknown". Must be
#                     a positive integer when set — 0 parses fine but is
#                     nonsense (no real model has a zero-token window) and
#                     will produce garbage wherever it's divided into.
#                     Cloud model
#                     windows below are cross-checked against Anthropic's,
#                     DeepSeek's, Google's, and OpenAI's own docs as of
#                     2026-07-29 (`kj rc reset` / a fresh kernel will pick up
#                     later corrections; see docs/config-crdt-ownership.md —
#                     an already-seeded kernel keeps its existing CRDT copy).
#                     Local models (ollama, lemonade) are deliberately absent:
#                     their effective context is a runtime/Modelfile setting
#                     (e.g. Ollama's `num_ctx`, which defaults to 2048
#                     regardless of what the weights support), not a fixed
#                     property of the model id the way a cloud API's is.

# Which provider to use by default (must be enabled below)
# deepseek is the affordable lane we experiment in; anthropic and the rest
# stay one alias away (`smart`, `best`, `opus`, `fable`) for when we need
# their power.
default_provider = "deepseek"

# ============================================================================
# Provider Configurations
# ============================================================================

[providers.anthropic]
enabled = true
api_key_env = "ANTHROPIC_API_KEY"
default_model = "claude-haiku-4-5"
max_output_tokens = 8192

[providers.anthropic.default_tools]
type = "all"

# Context windows read live from GET /v1/models/{id} (`max_input_tokens`)
# on 2026-08-02 — measured, not extrapolated.
#
# UNDATED ids on purpose. Dated ids get retired out from under us: both
# claude-sonnet-4-20250514 and claude-opus-4-20250514 return a hard 404 today,
# and the first of those was this file's own `default` alias. Undated aliases
# roll forward instead. Model ids track kaibo's config (~/.config/kaibo).
[providers.anthropic.models.claude-haiku-4-5]
context_window = 200000

[providers.anthropic.models.claude-opus-4-5]
context_window = 200000

[providers.anthropic.models.claude-opus-4-7]
context_window = 1000000

[providers.anthropic.models.claude-opus-4-8]
context_window = 1000000

[providers.anthropic.models.claude-opus-5]
context_window = 1000000

[providers.anthropic.models.claude-sonnet-4-6]
context_window = 1000000

[providers.anthropic.models.claude-sonnet-5]
context_window = 1000000

[providers.anthropic.models.claude-fable-5]
context_window = 1000000

# Latest Haiku is still 4.5 (2025-10-15) — there is no Haiku 5. Verified
# against the full model list, not assumed. Note it is also the one model here
# that supports NO effort levels, while opus-5 / sonnet-5 / fable-5 support
# low→max; worth remembering before routing effort-sensitive work at `fast`.

# claude-sonnet-4-20250514 ("Sonnet 4") is gone, not merely unlisted:
# `GET /v1/models/claude-sonnet-4-20250514` returns a real 404 (confirmed
# live 2026-08-02), as does claude-opus-4-20250514. It used to back the
# balanced/default aliases, which meant a fresh kernel shipped pointing at a
# model Anthropic no longer serves. Those aliases now point at deepseek.
# Left here as a marker: don't reintroduce either id. Note the live-lookup
# fallback can't rescue these — there is no window to fetch for a model that
# no longer exists, so a retired id stays honestly "unknown".

# Gemini support in kaijutsu is INCOMPLETE — `gemini` is not a `Provider`
# variant (llm/mod.rs: Claude / DeepSeek / OpenAi), so this block can only ever
# be inert. It stays as a shape-of-things-to-come template and MUST keep
# `enabled = false`: the load path skips disabled providers before resolving
# their type, which is the only reason an unsupported type is legal here.
# We reach Gemini through kaibo (cast="gemini"/"gemini-batch") instead.
[providers.gemini]
enabled = false
api_key_env = "GEMINI_API_KEY"
default_model = "gemini-2.0-flash"
max_output_tokens = 16384

[providers.gemini.default_tools]
type = "all"

# Confirmed via ai.google.dev/gemini-api/docs/models (2026-07-29).
[providers.gemini.models.gemini-2.0-flash]
context_window = 1000000

[providers.deepseek]
enabled = true
api_key_env = "DEEPSEEK_API_KEY"
# Read the key from a file; falls back to DEEPSEEK_API_KEY env if unreadable.
api_key_file = "~/.deepseek-key"
default_model = "deepseek-v4-flash"
# V4 models think by default; reasoning tokens count toward the output
# budget (max 64K), so leave headroom above a plain-answer ceiling.
max_output_tokens = 16384

[providers.deepseek.default_tools]
type = "all"

# Confirmed via api-docs.deepseek.com (2026-07-29).
[providers.deepseek.models.deepseek-v4-flash]
context_window = 1000000

[providers.deepseek.models.deepseek-v4-pro]
context_window = 1000000

# OpenAI itself, plus any OpenAI-compatible server (Ollama, lemonade,
# llama.cpp, a proxy) all share one provider implementation — they speak the
# same `/chat/completions` dialect. Set `base_url` for a local/proxy server;
# the API key is optional (a local server needs none).
# Aligned with kaibo's [backends.gpt] — same endpoint, same key file.
[providers.openai]
enabled = true
api_key_env = "OPENAI_API_KEY"
api_key_file = "~/.openai-key.txt"
base_url = "https://api.openai.com/v1"
default_model = "gpt-5.6-terra"
max_output_tokens = 16384

[providers.openai.default_tools]
type = "all"

# No [providers.openai.models.*] entries: we have no verified window for the
# gpt-5.6 family, and a fabricated denominator is worse than an honest
# "unknown" (the never-invent-a-denominator rule). Add one when confirmed.

# ollama and lemonade serve locally-hosted GGUF models. Their effective
# context window is a runtime setting (Ollama's `num_ctx`, a Modelfile
# PARAMETER, or a llama.cpp launch flag) rather than a fixed property of the
# model id — the same "gemma4:31b" string can be running at a 2K, 8K, or 32K
# window depending on how the server was started. No [providers.X.models.Y]
# entries are seeded here; `kj model` will correctly report "unknown" for
# these until an operator who knows their local server's actual config adds
# one.
[providers.ollama]
enabled = true
base_url = "http://localhost:11434/v1"
default_model = "gemma4:31b"

[providers.ollama.default_tools]
type = "all"

# lemonade — a local OpenAI-compatible server (AMD ROCm / llama.cpp). No API
# key; point `base_url` at your instance (the port/path are server-specific).
# Disabled by default since the endpoint is environment-specific.
[providers.lemonade]
enabled = false
base_url = "http://localhost:8000/api/v1"
default_model = "Gemma-4-E4B-it-GGUF"

[providers.lemonade.default_tools]
type = "all"

# ============================================================================
# Model Aliases (Optional)
# ============================================================================
# Short names for commonly used model configurations

[model_aliases]
fast     = { provider = "anthropic", model = "claude-haiku-4-5" }
cheap    = { provider = "anthropic", model = "claude-haiku-4-5" }
balanced = { provider = "deepseek",  model = "deepseek-v4-flash" }
default  = { provider = "deepseek",  model = "deepseek-v4-pro" }
smart    = { provider = "anthropic", model = "claude-opus-4-8" }
best     = { provider = "anthropic", model = "claude-opus-4-8" }
fable    = { provider = "anthropic", model = "claude-fable-5" }
opus     = { provider = "anthropic", model = "claude-opus-5" }
deepseek    = { provider = "deepseek", model = "deepseek-v4-flash" }
ds-flash    = { provider = "deepseek", model = "deepseek-v4-flash" }
ds-pro      = { provider = "deepseek", model = "deepseek-v4-pro" }
deepseek-pro  = { provider = "deepseek", model = "deepseek-v4-pro" }
deepseek-lite = { provider = "deepseek", model = "deepseek-v4-flash" }
local       = { provider = "ollama", model = "gemma4:31b" }
offline     = { provider = "ollama", model = "gemma4:31b" }
local-vision = { provider = "ollama", model = "gemma4:31b" }
local-fast  = { provider = "ollama", model = "qwen3.5:9b-bf16" }
local-moe   = { provider = "ollama", model = "qwen3.5:35b-a3b" }
# lemonade local models (enable [providers.lemonade] above to use these)
lemon       = { provider = "lemonade", model = "Gemma-4-26B-A4B-it-GGUF" }
lemon-fast  = { provider = "lemonade", model = "Gemma-4-E4B-it-GGUF" }
lemon-coder = { provider = "lemonade", model = "Qwen3-Coder-Next-GGUF" }

# ============================================================================
# Streaming Configuration
# ============================================================================

[streaming]
enabled = true
buffer_size = 1024
timeout_ms = 120000

# ============================================================================
# Rate Limiting (Optional)
# ============================================================================

[rate_limits]
requests_per_minute = 0        # 0 = unlimited
tokens_per_minute = 0          # 0 = unlimited
min_request_interval_ms = 0    # 0 = no cooldown

# ============================================================================
# Embedding Model (Semantic Indexing)
# ============================================================================
# Local ONNX embedding model for constellation clustering, drift discovery,
# and semantic search across contexts. Inference is pure-Rust (rten) — no
# ONNX Runtime library involved.
#
# Model dir should contain model.onnx + tokenizer.json.
# Recommended artifact for bge-small-en-v1.5:
#   fp32 export (works as-is, 133 MB): onnx/model.onnx + tokenizer.json from
#     https://huggingface.co/Xenova/bge-small-en-v1.5
#   int8 (34 MB, faster load, what we ship): quantize the fp32 export with
#     rten's own tool (needs a Python venv with onnxruntime, onnx, onnx_ir):
#     python ort-quantize.py dynamic fp32.onnx model.onnx
#     https://github.com/robertknight/rten/blob/main/tools/ort-quantize.py
#   Verify a candidate file: cargo run -p kaijutsu-index --example embed_check
#
# Quantized exports from other pipelines may not load — rten rejects e.g.
# fp16 initializers (the old Qdrant bge-small-en-v1.5-onnx-Q fails this way).
#
# Changing `model_dir` (even just renaming the directory — the model's
# identity is its directory basename) or `dimensions` invalidates the
# on-disk semantic index: it's wiped at next kernel start and re-populates
# lazily from the watcher / `kj synth all`.

[embedding]
enabled = true
model_dir = "~/.local/share/kaijutsu/models/bge-small-en-v1.5"
dimensions = 384
max_tokens = 512
