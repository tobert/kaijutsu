# Gate policy — the tuned allow/ask/deny tiers beneath the ledger's
# per-decision rules (docs/gate-policy-tuning.md). Read from disk at every
# shell submission; an edit lands with no rebuild and no reseed.
#
# Keys: "kj <verb> [<subcommand>]" (canonical names; an unknown verb fails
# the load) or "<command> [<first argument>]". Verdicts: allow, ask, deny.
# A more specific key wins; at equal specificity deny beats ask beats allow.
# Layers compose for the context's performer: [global], then [rc.<dir>] for
# its rc directory, then [root] when a root character performs it, then
# [character.<name>] for the character. Each later layer reads over the
# earlier ones, so the narrowest decides; a context with no performer reads
# [global] alone. A learned ledger
# rule outranks everything here; a verb's declared Read effect and the whole
# `kj ledger` verb are allowed beneath it.
#
# A [rc.<dir>] naming no rc directory, or a [character.<name>] naming no
# character, applies to nobody: `kj ledger rules` lists it, the kernel logs a
# warning when the set of such sections changes, and the file still loads.
#
# allow covers a key, never arguments: a redirect, a background flag, a
# heredoc or a substituted argument drops the statement back to the
# pre_call hooks and the gate. ask is firm — no lower layer can allow it.
# deny refuses at broker PreCall and inside the shell gate.
#
# A file that does not parse refuses every gated shell submission until it
# is fixed; `kj config reset gate.toml` restores this default.
#
# `uncovered` decides what happens to a statement no key covers: "ask" (the
# default, and what this file ships) or "allow". Set "allow" only on a
# sandboxed or throwaway kernel — a benchmark container, a kernel whose
# work you are ready to discard. It removes the human from the loop for
# that section: every statement no key covers runs, redirects, heredocs and
# substituted arguments included. No PreCall hook sees a program the tier
# allows outright, so the shell-escape guard never runs on one; a mixed
# program, where one statement is ask-tier or deny-tier, still meets the
# hooks. Explicit ask and deny keys still fire, and a learned
# ledger rule still outranks it. `kj ledger rules` states the posture when
# it is on.
#
#   [rc.coder]
#   uncovered = "allow"   # sandboxed benchmark kernels only
#
# A model that runs the `shell_write` tool from its shell asks twice: once
# here for the `shell_write` statement, then in the tool's own gate for the
# command it carries. Allowing the statement for a seat leaves the tool's
# gate as the one ask. This default leaves it off so each seat opts in:
#
#   [rc.coder]
#   allow = ["shell_write"]

# Council: a System 1 model check that may allow a statement the tiers
# above leave to the human. It is off. To turn it on, uncomment the
# sections below and enable it per rc directory or per character. A council
# block reads over the blocks before it key by key, in the order the layers
# compose, and the last block's `enabled` decides. The file refuses to load
# on an unknown field, a threshold naming no spec, or two thresholds for one
# spec. The council server is not named here: a context decides on its
# `gate` slot (`kj character slot set <character> gate <council backend>/<served
# model>`, then `kj context rotate`), and a context with no `gate`
# slot has no council. See docs/council.md, "Configuration".
#
#   [council]
#   contexts = ["council-system"]           # distinct context labels, at least one
#   pool = { method = "loglinear", weights = "mass" }   # linear|loglinear, uniform|mass
#   deadline_ms = 700                       # integer > 0; bounds the whole decision, preparing the server included; sent as timeout_ms
#   require_agree = true                    # default true: every read must agree to allow
#   reviewer_contexts = false             # default false; true composes council-<character> along the reviewer chain:
#                                           # a live root's council context joins the decision, a model character's is read after it
#                                           # under direction-check, and a character with no council context is recorded as skipped
#
#   [[council.spec]]
#   name = "shell-gate"                     # /config/kernel/council/shell-gate.json
#   case = "shell"                          # the only accepted value today
#
#   [[council.threshold]]                   # one per spec
#   spec = "shell-gate"                     # must name a [[council.spec]]
#   allow_at = 0.98                         # pooled p(allow); 0 < x <= 1
#   mass_floor = -0.05                      # each read's verdict mass; log probability, <= 0
#
#   [rc.coder.council]
#   enabled = true                          # off for every performer whose layers do not say so
#   judge = "judge"                         # the character that performs each seat's judge shadow; its model is
#                                           # the judge's council server. No judge key, no judge. The kernel
#                                           # archives a seat's judge shadows with the seat
#
#   [rc.banto.council]
#   enabled = true
#   contexts = ["council-amy", "council-banto"]  # replaces the shared contexts for this directory; spec contexts still join

# Optional shared policy for any judge. Without this table, model judges
# use bumper with a limit of 3 and a 3-bump streak within 30 minutes;
# Council v2 defaults to gatekeeper.
#
#   [judge]
#   mode = "bumper"                         # gatekeeper | bumper | bump-only
#   bump_limit = 3                          # omit in bump-only mode
#   escalate = { bumps = 3, minutes = 30 }   # omit to disable streak escalation

# Guardian: a chat model that judges what the tiers above escalate, by the
# policy in /config/kernel/council/guardian.md. It is off. A context is judged
# by the guardian when its `gate` slot names a chat backend (`kj character
# slot set <character> gate chatgpt/<model>`, then `kj context rotate`) and a
# section below enables it; the last section with a switch decides. An allow
# runs, a deny asks with the guardian's rationale, a deny at critical risk
# reports, and a failure asks as if there were no guardian. See
# docs/approval-identity.md, "The guardian".
#
#   [guardian]                              # optional; these are the defaults
#   deadline_ms = 30000                     # integer > 0; bounds the model call
#   transcript_tokens = 8000                # the transcript tail it reads, at four bytes a token
#   house_rules_tokens = 30000              # the AGENTS.md it reads, whole; a longer file is a miss, not a cut
#
#   [rc.kohai.guardian]
#   enabled = true

[global]
allow = [
  "kj handoff note",     # recoverable by construction
  "kj board post",       # board write policy (open/curated/locked) still governs publish vs ledger review
  "kj board reply",
  "kj board resolve",
  "kj board reopen",
  "kj block create",
  "kj block append",
  "kj stage include",
  "kj stage exclude",
  "rg",                  # non-kj entries: one-level key
  "wc",
]
ask = [
  "kj rc add",           # rc reaches every future context — a human sees each change
  "kj rc rm",
  "kj config reset",
  "git push",            # non-kj entry: two-level key
]
deny = [
  "dd",                  # no kaijutsu seat has a reason; uniform loud refusal
]

[rc.toolie]
deny = [
  "kj context create",     # a toolie uses tools; lifecycle belongs to its parent
]

# The mcp seat is the outside hand: an external agent (Claude Code) drives it
# and Amy is the one at the keyboard. Statements no key covers run without an
# ask. The ask and deny keys in [global] still fire (`git push`, `kj rc add`,
# `dd`), a learned ledger rule still outranks this, and the shell-escape guard
# does not see a statement the uncovered tier allows outright.
[rc.mcp]
uncovered = "allow"
allow = [
  "kj context create",     # an mcp seat spins up coders; recoverable: archive it
  "kj drive",            # runs a turn on a context this seat can already reach
  "kj context archive",  # a session ends itself; recoverable: `kj context promote`
]

[rc.banto]
allow = [
  "kj context create",     # banto creates its lanes, `kj context create coder --name <lane>`
  "kj fork",               # a fork copies this context's own performer
  "kj drive",              # runs a turn on a lane banto directs
  "kj drift push",         # banto messages senpai and other contexts
  "kj board create",       # banto manages boards and curates topics
  "kj board promote",
  "kj board pin",
  "kj board unpin",
  "kj board set",
  "kj price set",          # appends a price row; a correction is a later row
  "kj price set-tool",     # appends a tool price row; a correction is a later row
]

[rc.senpai]
allow = [
  "kj context create",     # senpai creates its lanes, `kj context create kohai --name <lane>`
  "kj fork",               # a fork copies this context's own performer
  "kj drive",              # runs a turn on a lane senpai directs
  "kj drift push",         # senpai messages banto and its kohai
  "kj board create",       # senpai manages its boards and promotes topics
  "kj board promote",
  "kj board pin",
  "kj board unpin",
]

[root]
allow = [
  "kj board create",       # console / root manages boards directly
  "kj board promote",
  "kj board pin",
  "kj board unpin",
  "kj board set",
  "kj price set",          # appends a price row; a correction is a later row
  "kj price set-tool",     # appends a tool price row; a correction is a later row
]

# The main seat of a companion has a writable shell while the person is
# present (docs/companion.md). The statement is quiet; the tool's own gate
# still judges the command it carries, and anything no key covers asks. A
# check-in has the read-only shell and needs no key.
[rc.companion]
allow = [
  "shell_write",
]
