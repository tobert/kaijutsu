# Gate policy — the tuned allow/ask/deny tiers beneath the ledger's
# per-decision rules (docs/gate-policy-tuning.md). Read from disk at every
# shell submission; an edit lands with no rebuild and no reseed.
#
# Keys: "kj <verb> [<subcommand>]" (canonical names; an unknown verb fails
# the load) or "<command> [<first argument>]". Verdicts: allow, ask, deny.
# A more specific key wins; at equal specificity deny beats ask beats allow.
# Layers compose: [global], then [context_type.<type>] over it. A learned
# ledger rule outranks everything here; a verb's declared Read effect and
# the whole `kj ledger` verb are allowed beneath it.
#
# allow covers a key, never arguments: a redirect, a background flag, a
# heredoc or a substituted argument drops the statement back to the
# pre_call hooks and the gate. ask is firm — no lower layer can allow it.
# deny refuses at broker PreCall and inside the shell gate.
#
# A file that does not parse refuses every gated shell submission until it
# is fixed; `kj config reset gate.toml` restores this default.
#
# `uncovered` decides what happens to a statement no key covers: "ask" (the
# default, and what this file ships) or "allow". Set "allow" only on a
# sandboxed or throwaway kernel — a benchmark container, a kernel whose
# work you are ready to discard. It removes the human from the loop for
# that section: every statement no key covers runs, redirects, heredocs and
# substituted arguments included. No PreCall hook sees a program the tier
# allows outright, so the shell-escape guard never runs on one; a mixed
# program, where one statement is ask-tier or deny-tier, still meets the
# hooks. Explicit ask and deny keys still fire, and a learned
# ledger rule still outranks it. `kj ledger rules` states the posture when
# it is on.
#
#   [context_type.coder]
#   uncovered = "allow"   # sandboxed benchmark kernels only
#
# A model that runs the `shell_write` tool from its shell asks twice: once
# here for the `shell_write` statement, then in the tool's own gate for the
# command it carries. Allowing the statement for a seat leaves the tool's
# gate as the one ask. This default leaves it off so each seat opts in:
#
#   [context_type.coder]
#   allow = ["shell_write"]

# Council: a System 1 model check that may allow a statement the tiers
# above leave to the human. It is off. To turn it on, uncomment the
# sections below, fill every identity field from the council server's
# answer, and enable it per context type. The file refuses to load on an
# unknown field, a bad URL, a threshold naming no spec, or two thresholds
# for one spec and identity. See docs/council.md, "Configuration".
#
#   [council]
#   server = "http://zorak:8090"            # http:// or https:// URL
#   contexts = ["council-system"]           # distinct context labels, at least one
#   pool = { method = "loglinear", weights = "mass" }   # linear|loglinear, uniform|mass
#   deadline_ms = 700                       # integer > 0; sent as timeout_ms
#   require_agree = true                    # default true: every read must agree to allow
#   voices = false                          # default false; true reads council-<character> along the reviewer chain
#
#   [[council.spec]]
#   name = "shell-gate"                     # /config/kernel/council/shell-gate.json
#   case = "shell"                          # the only accepted value today
#
#   [[council.threshold]]                   # one per (spec, identity)
#   spec = "shell-gate"                     # must name a [[council.spec]]
#   weight_hash = "..."
#   engine = "..."
#   tokenizer_hash = "..."
#   template = "..."
#   allow_at = 0.98                         # pooled p(allow); 0 < x <= 1
#   mass_floor = -0.05                      # each read's verdict mass; log probability, <= 0
#
#   [context_type.coder.council]
#   enabled = true                          # off for every type that does not say so

[global]
allow = [
  "kj handoff note",     # recoverable by construction; the friction that started this
  "kj block create",
  "kj block append",
  "kj stage include",
  "kj stage exclude",
  "rg",                  # non-kj entries exercising the key space: one-level key
  "wc",
]
ask = [
  "kj rc add",           # rc reaches every future context — a human sees each change
  "kj rc rm",
  "kj config reset",
  "git push",            # non-kj entry: two-level key
]
deny = [
  "dd",                  # no kaijutsu seat has a reason; uniform loud refusal
]

[context_type.toolie]
deny = [
  "kj context create",   # a toolie uses tools; lifecycle belongs to its parent
]

[context_type.mcp]
allow = [
  "kj context create",   # an mcp seat spins up coders; recoverable: archive it
  "kj drive",            # runs a turn on a context this seat can already reach
]

[context_type.director]
allow = [
  "kj context create",   # a director creates its lanes, `--type coder --as coder`
  "kj fork",             # a fork copies this seat's own performer and type
  "kj drive",            # runs a turn on a lane this seat directs
]
