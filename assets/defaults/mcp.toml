# Kaijutsu MCP Server Configuration
#
# Defines MCP servers to launch automatically when a kernel starts.
# Each server entry specifies how to connect (stdio subprocess or HTTP).
#
# Server fields:
#   enabled         - Whether to launch this server (default: true)
#   transport       - "stdio" (default) or "streamable_http"
#   command         - Executable path (stdio only)
#   args            - Arguments array (stdio only)
#   env             - Environment variables table. A value is a literal
#                     string, or a table naming one source (see below).
#   cwd             - Working directory (stdio only)
#   url             - Server URL (streamable_http only)
#   headers         - Extra HTTP headers table (streamable_http only). Values
#                     follow the same rule as env.
#   call_timeout_ms - Per-server override for how long a single tool call may
#                     run before timing out (default: the kernel-wide
#                     mcp_call_timeout_default, 120000ms). A long-running
#                     consultation (e.g. kaibo) needs this raised well above
#                     the default.
#
# ── Keeping a secret out of this file ───────────────────────────────────────
#
#   [servers.kaibo]
#   command = "kaibo-mcp"
#   env.KAIBO_API_KEY = { file = "~/.kaibo-key" }   # trimmed file contents
#   env.GITHUB_TOKEN  = { env = "GITHUB_TOKEN" }    # the kernel's environment
#   env.RUST_LOG      = "debug"                     # a literal, as before
#
# An HTTP server takes its credential in a header, the same way:
#
#   [servers.exa]
#   transport = "streamable_http"
#   url       = "https://mcp.exa.ai/mcp"
#   headers.x-api-key = { file = "~/.exa-key" }
#
# `env` reaches a child process and `headers` reaches an HTTP request, so
# naming the wrong one for the transport is reported, not quietly ignored.
#
# An `{ env = "..." }` source reads the KERNEL's environment. Under systemd
# that is the service's environment, which a shell `export` never reaches — on
# such a host, use a file source.
#
# A source table takes exactly one of `file` or `env`. `~` is expanded, and
# the value is trimmed. Anything else — two sources, an unknown key, a value
# that resolves to nothing — fails that ONE server: it is skipped, reported by
# `kj mcp list` with the reason, and never launched with a blank credential.
# Its neighbors still start.
#
# Sources resolve when this file is read. `kj mcp reload` does not respawn a
# server that is already running, so a rotated key reaches one only when it is
# next spawned — the same rule that already governs a `command`/`args`/`env`
# edit (docs/external-mcp.md, "The reload design fork").
#
# There is no `command` source yet. Host process execution has one owner in
# kaijutsu, so running a program to fetch a secret is its own design decision
# rather than a config field — see docs/issues.md.
#
# `kj mcp reload` re-reads this file and reconciles it against what's
# actually running; `kj mcp list` shows configured-vs-running with health.
# Editing this file has no live effect on its own — run `kj mcp reload`
# afterward.
#
# ── This file ships EMPTY, on purpose (2026-08-15) ──────────────────────────
#
# A seeded server entry launches a real subprocess in every kernel that boots
# from this default — including every kernel a test boots. Those children are
# not sandboxed: they inherit the environment, resolve their own XDG paths,
# and open the developer's live state. `[servers.kaibo]` used to live here and
# was opening ~/.local/state/kaibo/state.db during `cargo test`, alongside
# whatever kaibo the developer had running.
#
# It also meant a shipped asset carried a developer-machine absolute path,
# which was never going to be right on any other machine.
#
# So: a fresh kernel launches nothing external, and you add what you want to
# YOUR kernel. Existing kernels are unaffected — this file is seeded once, so
# their configured servers stay exactly as they are.
#
# Add one by editing this file. It is an ordinary host file under
# /config/kernel (docs/config-namespace.md), so the file tools, `kj editor`,
# vim and git all reach it. Then run `kj mcp reload`.
#
# The two we actually run on moltar, for reference:
#
#   [servers.bevy_brp]
#   command = "bevy_brp_mcp"
#
#   # call_timeout_ms is 900000 (15 min) because a kaibo consultation is a
#   # real model call — Gemini Pro / DeepSeek / Claude reading and reasoning
#   # over a codebase — and routinely runs 5-15 minutes. The kernel-wide
#   # default (120000ms / 2 min) would cut off every consultation.
#   [servers.kaibo]
#   command = "/home/atobey/src/kaibo/target/debug/kaibo"
#   args = ["--root", "/home/atobey/src/kaijutsu"]
#   call_timeout_ms = 900000
