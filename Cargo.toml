[workspace]
resolver = "2"
members = [
    "crates/kaijutsu-types",
    "crates/kaijutsu-editor",
    "crates/kaijutsu-diff",
    "crates/kaijutsu-kernel",
    "crates/kaijutsu-client",
    "crates/kaijutsu-server",
    "crates/kaijutsu-app",
    "crates/kaijutsu-mcp",
    "crates/kaijutsu-acp",
    "crates/kaijutsu-telemetry",
    "crates/kaijutsu-agent-tools",
    "crates/kaijutsu-index",
    "crates/kaijutsu-abc",
    "crates/kaijutsu-cas",
    "crates/kaijutsu-audio",
    "crates/kaijutsu-hyoushigi",
    "crates/kaijutsu-viz",
    "crates/kaijutsu-isotest",
    "crates/approval-ledger",
    "crates/claude-code-peer",
    "crates/kaijutsu-configgit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tobert/kaijutsu"

# Clippy floor: `all` (style/complexity/perf/etc., warn-by-default group) is a
# superset that includes `correctness`. Cargo resolves lint conflicts by
# priority (higher wins, default 0), not by table order, so `correctness`
# needs an explicit higher priority to actually win over `all` — without it
# both sit at priority 0 and the result is unspecified/last-one-wins by lint
# id rather than "correctness always deny". Member crates opt in via
# `[lints] workspace = true`.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }

[workspace.dependencies]
# Internal crates
kaijutsu-abc = { path = "crates/kaijutsu-abc" }
kaijutsu-cas = { path = "crates/kaijutsu-cas" }
kaijutsu-audio = { path = "crates/kaijutsu-audio" }
kaijutsu-hyoushigi = { path = "crates/kaijutsu-hyoushigi" }
kaijutsu-viz = { path = "crates/kaijutsu-viz" }
kaijutsu-types = { path = "crates/kaijutsu-types" }
kaijutsu-editor = { path = "crates/kaijutsu-editor" }
kaijutsu-diff = { path = "crates/kaijutsu-diff" }
kaijutsu-kernel = { path = "crates/kaijutsu-kernel" }
kaijutsu-client = { path = "crates/kaijutsu-client" }
kaijutsu-telemetry = { path = "crates/kaijutsu-telemetry" }
kaijutsu-agent-tools = { path = "crates/kaijutsu-agent-tools" }
approval-ledger = { path = "crates/approval-ledger" }
claude-code-peer = { path = "crates/claude-code-peer" }

# Kaish (execution engine + client) — pinned to published 0.14.
# `subprocess` compiles in host external-command execution; whether a given
# shell may actually use it is decided per-context at materialization
# (ExternalExec, gated on the `exec` loadout authority — deny by default).
# TEMPORARY `path` DEPS — Amy, 2026-08-17: *"let's link against local kaish for
# now, we'll switch back when 0.15 ships."*
#
# Pointing at the kaish lead's integration worktree, which merges `main` plus
# six queued branches (#350 frame-stack, #352 parser-properties, #349
# unicode-names, #351 name-class-xid, #348 error-presentation, docs/voice-guidance)
# plus the mid-word-`#` comment fix. Built for exactly this while GitHub's API is
# down and `main` cannot be merged to.
#
# **Developed against kaish rev `cf106d62a15163d8809d46615baff8662394984c`**
# (branch `integration/kaijutsu-preview`). Recorded here because a `path` dep
# pins NOTHING — it follows whatever the working tree holds. The kaish lead has
# committed to append-only history on that branch while we are linked, and to
# message before retiring it; `21642871…` (the rev we first linked at) is
# verified an ancestor of this one.
#
# **This line has already gone stale once, which is the point of having it.** We
# linked at `21642871…`, the lead appended a merge on top, and the worktree moved
# under us with nothing in the build to signal it — exactly the failure mode a
# `path` dep invites. Re-read `git -C /home/atobey/src/wt/kaish-integration
# rev-parse HEAD` and re-run the suite whenever you touch this; do not assume
# the rev above is what you just built.
#
# Why this over the crates.io pin: the confirmation gate (docs/gate-and-shell-split.md
# Slice 4) needs `plan_program` *and* the heredoc surface (`expand_fragment` /
# `PlannedHeredoc`) to render an honest prompt. On 0.14.1 a heredoc body is
# unrenderable, so a crates.io pin would have meant writing a throwaway
# heredoc-refusal path and then deleting it.
#
# **What this costs, so it gets undone.** `6ebb0a8b` deliberately removed the
# last git source from `Cargo.lock`. A `path` dep is worse than a git rev in one
# way: a git rev resolves for anyone who clones, a path resolves only on a
# machine holding that worktree. **This makes the workspace unbuildable on
# moltar and the MacBook.** Revert to a crates.io pin when 0.15 ships — that is
# a standing trigger, not a nice-to-have.
kaish-kernel = { path = "/home/atobey/src/wt/kaish-integration/crates/kaish-kernel", features = ["subprocess"] }
kaish-glob = { path = "/home/atobey/src/wt/kaish-integration/crates/kaish-glob" }
kaish-types = { path = "/home/atobey/src/wt/kaish-integration/crates/kaish-types" }
kaish-help = { path = "/home/atobey/src/wt/kaish-integration/crates/kaish-help" }

# Cap'n Proto
capnp = "0.25"
capnp-rpc = "0.25"
capnpc = "0.25"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# SSH
russh = "0.61"
russh-sftp = "2.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# Utilities
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
whoami = "1.5"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
strum = { version = "0.26", features = ["derive"] }
regex = "1"
include_dir = "0.7"
dirs = "6"
hostname = "0.3"
dunce = "1"
indexmap = "2"

# gitignore classification (ripgrep's crate) — VFS snapshot's `ignored` flag,
# docs/scenes/vfs.md. Already in the lock file transitively (kaish-kernel);
# pinned as a direct dep so kaijutsu-kernel can use it deliberately.
ignore = "0.4"

# Async utilities
async-trait = "0.1"

# Concurrency
dashmap = "6"
parking_lot = "0.12"

# RNG — 0.8 was pinned by diamond-types-extended (jumprope), which is gone.
# Nothing forces this version now; it is free to move on its own merits.
rand = "0.8"
shellexpand = "3"

# Bevy Remote Protocol (debugging)
bevy_remote = "0.19"
# NOTE: bevy_brp_extras' version number tracks its own releases, NOT bevy's —
# 0.19.0 wanted bevy 0.18.1 and was what pinned us to 0.18. 0.20+ wants bevy
# 0.19. Read its manifest, never its version number, before bumping bevy.
bevy_brp_extras = "0.22"
bevy_mesh = "0.19"

# Geometry primitives (used directly by kaijutsu-abc's engraving IR; also a
# direct kaijutsu-app dependency, not a vello re-export — vello itself is
# gone, retired 2026-08-12, docs/issues.md)
kurbo = "0.13"

# Text rendering
pulldown-cmark = "0.13"

# Diff engine (Apache-2.0) — the engine inside gitoxide and Helix. Histogram +
# Myers over *arbitrary* token streams, so word-level refinement is the same
# engine with a different tokenizer. `kaijutsu-diff` writes no diff algorithm.
imara-diff = "0.2"

# Persistence
rusqlite = { version = "0.39", features = ["bundled"] }

# Configuration
toml = "0.8"

# MCP (Model Context Protocol)
rmcp = { version = "3.1", features = ["client", "elicitation", "transport-child-process", "transport-streamable-http-client-reqwest"] }

# Vi-modal editing (keystroke → semantic action state machine)
modalkit = "0.0.25"
editor-types = "0.0.2"

# System clipboard
arboard = { version = "3", features = ["wayland-data-control"] }

# Tracing + OpenTelemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.31"
tracing-opentelemetry = "0.32"

# Testing
tempfile = "3"


