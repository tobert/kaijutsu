# Kaijutsu's authored read on every `kj <path>` leaf, joined against
# reflection by `kj/corpus.rs`. A table key is the leaf's space-joined path
# without the `kj` prefix — must match a live leaf exactly, in both
# directions, or `corpus()` refuses to build (see corpus.rs's coverage test).
#
# expect: "informative" | "situation-normal" | "data-critical"
#   - not mutating -> informative
#   - mutating but recoverable/reversible -> situation-normal
#   - permanent, irreversible, or destroys something unrecoverable ->
#     data-critical
# mutates: changes durable kernel state.
# confirm_gated: the handler tests KjCaller.confirmed (exactly six sites in
#   the whole kj surface: doc delete, context archive/remove/retag,
#   workspace remove, preset remove).
# clause: optional literal override. Omit to synthesize `kj <path>` plus one
#   placeholder per required positional (corpus.rs's synthesize_clause). Two
#   subtrees need an override because a required arg lives on an ANCESTOR
#   command, not the leaf itself, so synthesis can't see it: `block edit
#   <id> <op>` (block_id is on the `edit` node) and `midi send <device>
#   <op>` (device is on the `send` node). A handful of others are overridden
#   only for domain-realistic sample values (a hook id that isn't a hex
#   string, a VFS path instead of an rc path).
#
# Bootstrapped from the hand audit in docs/kj-verbs.md (2026-08-24) and the
# authored severity rungs in docs/issues.md, "The `kj` verb probe family,
# with our truth rungs" (2026-08-25) — that table's rungs win over the
# mechanical mapping above wherever the two disagree, and its `note` text is
# reused verbatim. Four subtrees the hand audit collapsed into one row each
# turned out to be multiple live leaves once reflected: `backend default`
# (show/set), `block edit` (delete/insert/replace), `ledger signal` (add),
# `midi send` (cc/note/pc/sysex).

