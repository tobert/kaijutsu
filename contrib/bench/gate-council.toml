# Council gate policy: a benchmark container with System 1 in the gate.
#
# Every statement no key covers goes to the council (docs/council.md). The
# council allows what it judges routine; anything else stays an ask. Run
# Harbor with `--ak permission_mode=deny` so an ask is refused rather than
# approved: then the council's verdict decides what runs, and the model sees
# each refusal. With Harbor's default `allow`, every ask is approved and the
# council only records what it would have stopped.
#
# The council reads `council-system`, which the `council` rc variant creates
# (contrib/bench/rc-variants/council). The threshold identity comes from
# `GET http://zorak:8090/council/v1/identity`; when the server's model or
# template changes, every decision is a miss until these fields follow it.

[global]
uncovered = "ask"

[council]
server = "http://zorak:8090"
contexts = ["council-system"]
pool = { method = "loglinear", weights = "mass" }
deadline_ms = 3000
require_agree = true
voices = false

[[council.spec]]
name = "shell-gate"
case = "shell"

[[council.threshold]]
spec = "shell-gate"
weight_hash = "0e25ef0d3240134fc2ba763e69a4d5e273bbd5bdf7a8d3386834f90bf2f59c37"
engine = "044545114a4e0112d9ac2ba1bdb2682f688dfca5:8a85c7dc4023b87b845091fe42d477733f3c2e153e086c73a1112861001ec6a9"
tokenizer_hash = "518665209619906d18852264fb032d302f6171425e4faa84aec9ac7d4b96cac6"
template = "mk-letters-1:47004159d76ccca4"
allow_at = 0.98
mass_floor = -0.05

[context_type.coder.council]
enabled = true
