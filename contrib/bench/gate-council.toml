# Council gate policy: a benchmark container with System 1 in the gate.
#
# Every statement no key covers goes to the council (docs/council.md). The
# council allows what it judges routine; anything else stays an ask. Run
# Harbor with `--ak permission_mode=deny` so an ask is refused rather than
# approved: then the council's verdict decides what runs, and the model sees
# each refusal. With Harbor's default `allow`, every ask is approved and the
# council only records what it would have stopped.
#
# The council reads `council-system`, which the `council` rc variant creates
# (contrib/bench/rc-variants/council). The threshold identity comes from
# `GET http://zorak:8090/council/v1/identity`; when the server's model or
# template changes, every decision is a miss until these fields follow it.

[global]
uncovered = "ask"

[council]
server = "http://zorak:8090"
contexts = ["council-system"]
pool = { method = "loglinear", weights = "mass" }
# Exploration values from the Sonnet benchmark runs: a 3000 ms deadline
# missed when a shell and a program decision run together.
deadline_ms = 10000
require_agree = true
voices = false
# Each decision also reads the house rules: the first AGENTS.md above the
# seat's working directory, up to house_rules_tokens (docs/council.md,
# "House rules"). A task container has none, so the decision reads no extra
# context there; the line stays so a workspace that has one is read.
house_rules = true
house_rules_tokens = 2000

[[council.spec]]
name = "shell-gate"
case = "shell"

[[council.threshold]]
spec = "shell-gate"
weight_hash = "0e25ef0d3240134fc2ba763e69a4d5e273bbd5bdf7a8d3386834f90bf2f59c37"
engine = "libmkengine:3de1b0df354b624f+numbers:1c7a6cfc4c2ffe18"
tokenizer_hash = "518665209619906d18852264fb032d302f6171425e4faa84aec9ac7d4b96cac6"
template = "mk-letters-2:0b697183e7a5b7cb"
allow_at = 0.98
# Shell verdict mass on real commands ran -0.30 to -1.02, so -0.05 missed
# most decisions; -1.5 is an exploration value, a miss guard only.
mass_floor = -1.5

# Each program a submission runs (a python script, `python3 -c`, a heredoc,
# `bash FILE`, `./script`) gets its own decision under program-gate, which
# the kernel seeds to /config/kernel/council/program-gate.json. The program
# decision allows on its rubric (originals and network), not on allow_at;
# the threshold supplies the identity and the mass floor. Probes on the
# megakernel put verdict mass on program text at about -0.3 to -1.0, so
# -0.05 would make every program decision a miss; -1.5 is an exploration
# value, a miss guard only.
[[council.spec]]
name = "program-gate"
case = "program"
# Program notes and worked examples with their reasoning, created by the
# council rc variant's S05-council-code.
contexts = ["council-code"]

[[council.threshold]]
spec = "program-gate"
weight_hash = "0e25ef0d3240134fc2ba763e69a4d5e273bbd5bdf7a8d3386834f90bf2f59c37"
engine = "libmkengine:3de1b0df354b624f+numbers:1c7a6cfc4c2ffe18"
tokenizer_hash = "518665209619906d18852264fb032d302f6171425e4faa84aec9ac7d4b96cac6"
template = "mk-letters-2:0b697183e7a5b7cb"
allow_at = 0.98
mass_floor = -1.5

[context_type.coder.council]
enabled = true
