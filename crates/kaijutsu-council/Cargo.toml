[package]
name = "kaijutsu-council"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The HTTP client for a council v2 server, over gogi-proto types"

[lints]
workspace = true

[features]
# The scripted HTTP server the crate's tests use, for callers' tests.
test-util = []

[dependencies]
gogi-proto = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = "0.13"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
gogi-fake = { workspace = true }
