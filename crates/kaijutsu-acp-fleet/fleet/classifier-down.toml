description = "An unreachable classifier fails closed: the call asks, the ask names the outage, and deny leaves the workspace alone."

[classifier]
behavior = "down"

[[model]]
tool_calls = [{ name = "shell_write", input = { command = "mkdir unscored" } }]
[[model]]
text = "asked"
[[model]]
text = "left it alone"

[[prompt]]
text = "make the unscored directory"
permissions = ["deny"]
permission_titles = ["/v1/cascade unreachable"]
text_contains = ["left it alone"]
tool_calls = [{ title = "shell_write", status = "failed" }, { title = "kj" }]

[[verify]]
path = "unscored"
exists = false
