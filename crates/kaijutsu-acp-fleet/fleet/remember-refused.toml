description = "An \"always allow\" the ledger cannot remember (a free variable) still allows this ask, and the client is told no rule was remembered."

gate = """
[global]
allow = ["export"]
"""

[[model]]
tool_calls = [{ name = "shell_write", input = { command = "export GREETING=hello" } }]
[[model]]
tool_calls = [{ name = "shell_write", input = { command = "echo $GREETING > greeting.txt" } }]
[[model]]
text = "wrote the greeting"
tool_calls = [{ name = "done", input = { status = "done", feedback = "wrote greeting.txt" } }]

[[prompt]]
text = "write the greeting"
permissions = ["allow_always"]
permission_titles = ["NOTE: at ask time GREETING=\"hello\""]
text_contains = ["applied to this ask only; no standing rule was remembered", "GREETING", "wrote the greeting"]
tool_calls = [{ title = "shell_write", status = "completed" }, { title = "shell_write", status = "completed" }, { title = "done", status = "completed" }]

[[verify]]
path = "greeting.txt"
equals = "hello\n"
