description = "Property (e), path A: the policy in force when a command was first evaluated covers its approval; a deny rule remembered after the ask does not stop the approved command."

gate = """
[global]
"""

# One reply makes the same call twice. The two calls run concurrently, so
# both ask before either is answered, and the turn holds on both.
[[model]]
tool_calls = [
  { name = "shell_write", input = { command = "mkdir late" } },
  { name = "shell_write", input = { command = "mkdir late" } },
]
[[model]]
text = "one refused, one ran"
tool_calls = [{ name = "done", input = { status = "done", feedback = "made the late directory once" } }]
[[model]]
tool_calls = [{ name = "shell_write", input = { command = "mkdir late" } }]
[[model]]
text = "the rule refused it"
tool_calls = [{ name = "done", input = { status = "blocked", feedback = "a rule denies mkdir late" } }]

# Both requests are held until both have arrived. The first is answered
# "always deny", which remembers a deny rule; only once the bridge has
# recorded that is the second allowed. The rule came after the second ask
# was evaluated, so the approval runs.
[[prompt]]
text = "make the late directory twice"
permissions = ["hold", "hold"]
release = ["deny_always", "allow"]
permission_titles = ["mkdir late", "mkdir late"]
text_contains = ["one refused, one ran"]
# The two calls may ask in either order, so their statuses are not checked
# here; `late` existing afterward is the approved one. The `kj` calls are the
# bridge recording each answer, in the order the runner sent them.
tool_calls = [
  { title = "shell_write" },
  { title = "shell_write" },
  { title = "kj", status = "completed", output_contains = "remembered as a standing always rule" },
  { title = "kj", status = "completed", output_contains = "allowed ask" },
  { title = "done", status = "completed" },
]

# The rule is in force: the same command is refused with no ask.
[[prompt]]
text = "make it again"
text_contains = ["the rule refused it"]
tool_calls = [{ title = "shell_write", status = "failed", output_contains = "user rule denies the exact statement" }, { title = "done", status = "completed" }]

[[verify]]
path = "late"
exists = true
