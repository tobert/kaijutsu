description = "Property (d), path B: an approved hook ask on the read-only shell runs with the read-only policy it was asked under, so a write stays refused."

[rc]
"coder/create/S60-fleet-hook.kai" = """
kj hook add pre_call '{"match_tool":"shell","hook_id":"fleet-shell-ask"}' '{"type":"kaish_path","path":"/config/rc/lib/hooks/fleet.kai"}'
"""
"lib/hooks/fleet.kai" = """
cmd="$(echo $KJ_TOOL_ARGS | jq -r '.command')"
echo "fleet hook asks about: $cmd" >&2
exit 3
"""

[[model]]
tool_calls = [{ name = "shell", input = { command = "mkdir escaped" } }]
[[model]]
text = "after the approval"
tool_calls = [{ name = "done", input = { status = "blocked", summary = "the read-only shell refuses mkdir" } }]

[[prompt]]
text = "make the escaped directory"
permissions = ["allow"]
permission_titles = ["fleet hook asks about: mkdir escaped"]
text_contains = ["after the approval"]
tool_calls = [{ title = "shell", status = "failed", output_contains = "read-only shell (no writes)" }, { title = "kj", status = "completed", output_contains = "allowed ask" }, { title = "done", status = "completed" }]

[[verify]]
path = "escaped"
exists = false
