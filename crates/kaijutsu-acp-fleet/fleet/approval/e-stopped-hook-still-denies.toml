description = "Property (e), path A: a deny later in the hook chain than an ask refuses before anyone is asked, so no approval can run what it refuses."

# Two pre_call hooks on shell_write, lower priority first: the first asks
# and the second denies. The chain runs to the end, and the deny wins.
[rc]
"coder/create/S60-fleet-hook.kai" = """
kj hook add pre_call '{"match_tool":"shell_write","hook_id":"fleet-ask","priority":10}' '{"type":"kaish_path","path":"/config/rc/lib/hooks/fleet-ask.kai"}'
kj hook add pre_call '{"match_tool":"shell_write","hook_id":"fleet-deny","priority":20}' '{"type":"kaish_path","path":"/config/rc/lib/hooks/fleet-deny.kai"}'
"""
"lib/hooks/fleet-ask.kai" = """
cmd="$(echo $KJ_TOOL_ARGS | jq -r '.command')"
echo "fleet hook asks about: $cmd" >&2
exit 3
"""
"lib/hooks/fleet-deny.kai" = """
echo "fleet hook denies" >&2
exit 1
"""

[[model]]
tool_calls = [{ name = "shell_write", input = { command = "mkdir stopped" } }]
[[model]]
text = "refused"

[[prompt]]
text = "make the stopped directory"
text_contains = ["refused"]
tool_calls = [{ title = "shell_write", status = "failed", output_contains = "denied by hook fleet-deny" }]

[[verify]]
path = "stopped"
exists = false
