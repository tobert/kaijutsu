description = "Property (d), path A: an approved shell_write ask runs the command it showed, in the cwd and with the env it recorded, though a sibling call changed both before the answer."

gate = """
[global]
allow = ["mkdir", "cd", "export", "sleep"]
"""

# Set a cwd and a variable.
[[model]]
tool_calls = [{ name = "shell_write", input = { command = "mkdir sub" } }]
[[model]]
tool_calls = [{ name = "shell_write", input = { command = "cd sub" } }]
[[model]]
tool_calls = [{ name = "shell_write", input = { command = "export SHOWN=shown-value" } }]

# The turn holds on its own ask, so only a sibling call in the same reply can
# change the context's cwd and env before the answer. The sibling waits for
# the runner's `asked` file, written once the ask is offered, then leaves
# sub, changes the variable, and makes `d-drifted` in the workspace root as
# proof of both. The runner answers only after `d-drifted` exists.
[[model]]
tool_calls = [
  { name = "shell_write", input = { command = "echo $SHOWN > out.txt" } },
  { name = "shell_write", input = { command = "while ! [[ -f ../asked ]]; do sleep 0.05; done; cd ..; export SHOWN=drifted; mkdir \"d-$SHOWN\"" } },
]
# The same turn then reads the context's live state: the workspace root and
# SHOWN=drifted, which a command that ignored what the ask recorded would
# have used.
[[model]]
tool_calls = [{ name = "shell_write", input = { command = "mkdir \"after-$SHOWN\"" } }]
[[model]]
text = "wrote it where it was shown"
tool_calls = [{ name = "done", input = { status = "done", summary = "wrote out.txt in sub" } }]

[[prompt]]
text = "write the variable into sub"
permissions = ["hold"]
release = ["allow"]
on_hold = { write = "asked", wait_for = "d-drifted" }
permission_titles = ["echo $SHOWN > out.txt\n\nNOTE: at ask time SHOWN=\"shown-value\""]
text_contains = ["wrote it where it was shown"]

[[verify]]
path = "d-drifted"
exists = true

[[verify]]
path = "after-drifted"
exists = true

[[verify]]
path = "sub/out.txt"
equals = "shown-value\n"

[[verify]]
path = "out.txt"
exists = false
