description = "Property (d), path A: an ask answered \"always allow\" through ACP runs the approved command, as an allow once does, and the held turn goes on."

gate = """
[global]
"""

[[model]]
tool_calls = [{ name = "shell_write", input = { command = "mkdir made" } }]
[[model]]
text = "ran once"
tool_calls = [{ name = "done", input = { status = "done", summary = "made the made directory" } }]

[[prompt]]
text = "make the made directory"
permissions = ["allow_always"]
permission_titles = ["shell_write: 1 statement(s) — mkdir made"]
text_contains = ["ran once"]
tool_calls = [{ title = "shell_write", status = "completed" }, { title = "kj", status = "completed" }, { title = "done", status = "completed" }]

[[verify]]
path = "made"
exists = true
