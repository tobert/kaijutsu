description = "Contained mode's rc overlay turns the classifier hook off: under an asking gate, the only ask is the gate's own, not the hook's."

mode = "contained"

# Every uncovered statement asks, so the hooks run. With the hook on and no
# classifier configured, the ask would read "cannot score this call".
gate = """
[global]
"""

[[model]]
tool_calls = [{ name = "shell_write", input = { command = "git init -q" } }]
[[model]]
text = "asked"
[[model]]
text = "left it alone"

[[prompt]]
text = "start a repository"
permissions = ["deny"]
permission_titles = ["shell_write: 1 statement(s) — git init -q"]
text_contains = ["left it alone"]

[[verify]]
path = ".git"
exists = false
