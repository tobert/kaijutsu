description = "Contained bump-only with escalate after 3: the scripted council on the host is reached through the relay, two shell_write calls are bumped, and the third raises one permission request whose allow runs it."

mode = "contained"

gate = """
[council]
server = "{council}"
contexts = ["fleet-seat"]
mode = "bump-only"
escalate = { bumps = 3, minutes = 10 }
pool = { method = "loglinear", weights = "mass" }
deadline_ms = 5000

[[council.spec]]
name = "shell-bump"
case = "shell"

[[council.threshold]]
spec = "shell-bump"
allow_at = 0.98
mass_floor = -0.05

[context_type.coder.council]
enabled = true
"""

# The council reads a context by label. The session's create lifecycle
# gives the seat itself one, so the council reads the seat's own
# conversation.
[rc]
"coder/create/S50-fleet-council.kai" = """
kj context rename fleet-seat
"""

[council]
verdicts = ["try_harder", "do_less", "try_harder", "proceed"]
undo = "irreversible"

[[model]]
tool_calls = [{ name = "shell_write", input = { command = "touch one" } }]
[[model]]
tool_calls = [{ name = "shell_write", input = { command = "touch two" } }]
[[model]]
tool_calls = [{ name = "shell_write", input = { command = "touch three" } }]
[[model]]
text = "made three"
tool_calls = [{ name = "done", input = { status = "done", feedback = "made three after two bumps" } }]

[[prompt]]
text = "make the files"
permissions = ["allow"]
permission_tool_calls = ["shell_write"]
permission_titles = ["The council bumped this seat 2 times in a row within 10 minutes (try_harder; do_less), so this one asks."]
text_contains = ["made three"]
tool_calls = [
  { title = "shell_write", status = "failed", output_contains = ["Bumped by the council", "needs more care first", "reads it as irreversible"] },
  { title = "shell_write", status = "failed", output_contains = ["Bumped by the council", "reaches past what the task needs"] },
  { title = "shell_write", status = "completed" },
  { title = "done", status = "completed" },
]

[[verify]]
path = "one"
exists = false
[[verify]]
path = "two"
exists = false
[[verify]]
path = "three"
exists = true
