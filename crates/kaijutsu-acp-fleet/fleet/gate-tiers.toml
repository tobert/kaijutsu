description = "Gate tiers hold around a pre_call hook: allow runs with no ask and never reaches the hook, deny refuses before it, and ask asks after the hook proceeds."

gate = """
[global]
allow = ["mkdir"]
ask = ["mv"]
deny = ["dd"]
"""

# The hook proceeds and records each command it sees: only the ask-tier
# statement reaches it.
[rc]
"coder/create/S60-fleet-hook.kai" = """
kj hook add pre_call '{"match_tool":"shell_write","hook_id":"fleet-hook"}' '{"type":"kaish_path","path":"/config/rc/lib/hooks/fleet.kai"}'
"""
"lib/hooks/fleet.kai" = """
echo $KJ_TOOL_ARGS | jq -r '.command' >> hook-saw.txt
exit 0
"""

[files]
"seed.txt" = "seed\n"

[[model]]
tool_calls = [{ name = "shell_write", input = { command = "mkdir tier-allowed" } }]
[[model]]
text = "made it"
tool_calls = [{ name = "done", input = { status = "done", feedback = "made the directory" } }]

[[model]]
tool_calls = [{ name = "shell_write", input = { command = "dd if=seed.txt of=copy.txt" } }]
[[model]]
text = "refused"
tool_calls = [{ name = "done", input = { status = "blocked", feedback = "dd is denied" } }]

[[model]]
tool_calls = [{ name = "shell_write", input = { command = "mv seed.txt moved.txt" } }]
[[model]]
text = "left it alone"
tool_calls = [{ name = "done", input = { status = "blocked", feedback = "the move was denied" } }]

[[prompt]]
text = "make the directory"
text_contains = ["made it"]
tool_calls = [{ title = "shell_write", status = "completed" }, { title = "done", status = "completed" }]

[[prompt]]
text = "copy with dd"
text_contains = ["refused"]
tool_calls = [{ title = "shell_write", status = "failed", output_contains = "global config denies dd" }, { title = "done", status = "completed" }]

[[prompt]]
text = "move the seed"
permissions = ["deny"]
permission_titles = ["shell_write: 1 statement(s) — mv seed.txt moved.txt"]
text_contains = ["left it alone"]
tool_calls = [{ title = "shell_write", status = "failed", output_contains = "denied by solo (deny)" }, { title = "done", status = "completed" }]

[[verify]]
path = "tier-allowed"
exists = true

[[verify]]
path = "copy.txt"
exists = false

[[verify]]
path = "seed.txt"
equals = "seed\n"

[[verify]]
path = "moved.txt"
exists = false

[[verify]]
path = "hook-saw.txt"
equals = "mv seed.txt moved.txt\n"
