description = "On a headless kernel a coder's text-only reply does not end its prompt: the kernel's notice reaches the client as agent text, the model calls done, and the prompt ends end_turn."

headless = true

# The first reply is narration with no tool call. The kernel answers it with
# a (System, Notification), which the bridge sends as an agent message, and
# runs another inference in the same turn.
[[model]]
text = "Next I'll run the tests."
[[model]]
text = "The tests pass."
tool_calls = [{ name = "done", input = { status = "done", feedback = "the tests pass" } }]

[[prompt]]
text = "run the tests"
text_contains = ["Next I'll run the tests.", "You replied without a tool call, so the task is still open.", "The tests pass."]
tool_calls = [{ title = "done", kind = "other", status = "completed", output_contains = "done: the tests pass" }]
