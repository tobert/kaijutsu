description = "A plain chat turn: the model's text reaches the client and the turn ends cleanly."

[[model]]
text = "fleet mock speaking"
tool_calls = [{ name = "done", input = { status = "done", feedback = "said something" } }]

[[prompt]]
text = "say something"
text_contains = ["fleet mock speaking"]
tool_calls = [{ title = "done", status = "completed" }]
