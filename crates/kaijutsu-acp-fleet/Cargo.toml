[package]
name = "kaijutsu-acp-fleet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Scenario tests that drive an ACP agent over stdio and check the workspace it leaves behind"

[[bin]]
name = "acp-fleet"
path = "src/main.rs"

[lints]
workspace = true

# A plain ACP client: std threads and newline-delimited JSON-RPC, with no
# kaijutsu crate underneath, so it can drive any ACP agent command. The
# scripted council (`src/council.rs`) uses kaijutsu-mk's wire types and
# math, so its answers carry the numbers a kernel recomputes.
[dependencies]
anyhow.workspace = true
clap.workspace = true
kaijutsu-mk.workspace = true
# openat2 with RESOLVE_NO_SYMLINKS, for host-side workspace access
# (`src/workspace.rs`).
rustix = { version = "0.38", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
