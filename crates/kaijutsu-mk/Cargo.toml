[package]
name = "kaijutsu-mk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Megakernel client: council API wire types, spec ids, answer and pool math, and the HTTP transport"

[lints]
workspace = true

[features]
# The scripted HTTP server the crate's tests use, for callers' tests.
test-util = []

[dependencies]
hex = "0.4"
indexmap = { workspace = true, features = ["serde"] }
reqwest = "0.13"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }
