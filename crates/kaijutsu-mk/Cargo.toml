[package]
name = "kaijutsu-mk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Megakernel client: the HTTP transport for the council API (gogi-proto types) and /mk/v1"

[lints]
workspace = true

[features]
# The scripted HTTP server the crate's tests use, for callers' tests.
test-util = []

[dependencies]
gogi-proto = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = "0.13"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
gogi-fake = { workspace = true }
jsonschema = { version = "0.58.6", default-features = false }
