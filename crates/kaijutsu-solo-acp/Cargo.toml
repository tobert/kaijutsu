[package]
name = "kaijutsu-solo-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "All-in-one ACP v1 agent: a private kaijutsu kernel in-process, served on stdio"

[[bin]]
name = "kaijutsu-solo-acp"
path = "src/main.rs"

[[bin]]
# A one-tool MCP stdio server for this crate's tests
# (`CARGO_BIN_EXE_mcp-fixture`). Not part of a release build.
name = "mcp-fixture"
path = "src/bin/mcp_fixture.rs"
required-features = ["test-mock"]

[[test]]
# The ACP scenario fleet (`docs/acp-fleet.md`) runs every scenario against
# this binary: `cargo test -p kaijutsu-solo-acp --features test-mock --test acp_fleet`.
name = "acp_fleet"
required-features = ["test-mock"]

[[test]]
# Client-declared MCP servers, end to end against `mcp-fixture`.
name = "acp_mcp_servers"
required-features = ["test-mock"]

[lints]
workspace = true

[features]
# The scripted test backend (`KJ_MOCK_SCRIPT_DIR`). Passes straight through to
# the kernel's own feature: this crate's integration tests drive real turns
# with it, and a release build must not carry it.
test-mock = ["kaijutsu-kernel/test-mock", "dep:serde_json"]

[dependencies]
# The ACP half is consumed as a library, unchanged. This binary adds a kernel
# underneath it and nothing else.
kaijutsu-acp = { path = "../kaijutsu-acp" }
kaijutsu-client.workspace = true
kaijutsu-kernel.workspace = true
kaijutsu-server.workspace = true
kaijutsu-types.workspace = true
# The same path helpers the kernel resolves its own locations with, so the
# "already writable" check and the operator's XDG trees cannot disagree.
kaish-kernel.workspace = true

anyhow.workspace = true
# `atexit`, so a temporary state directory is removed on every orderly exit,
# including the ones that call `exit()` from another thread.
libc = "0.2"
clap.workspace = true
parking_lot.workspace = true
russh.workspace = true
# `russh::keys` generates with rand 0.10; the workspace `rand` is 0.8.
rand_v10 = { package = "rand", version = "0.10" }
tempfile.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
whoami.workspace = true
# The `mcp-fixture` test binary's JSON-RPC.
serde_json = { workspace = true, optional = true }

[dev-dependencies]
kaijutsu-acp-fleet = { path = "../kaijutsu-acp-fleet" }
# Signals, for the tests that prove an interrupted run still removes its
# temporary state.
libc = "0.2"
serde_json.workspace = true
tempfile.workspace = true
