[package]
name = "kaijutsu-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal client for the kaijutsu kernel: ratatui over an inline viewport, kernel over SSH"

[[bin]]
name = "kaijutsu-tui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
kaijutsu-client.workspace = true
kaijutsu-diff.workspace = true
kaijutsu-editor.workspace = true
kaijutsu-present.workspace = true
kaijutsu-types.workspace = true
kaijutsu-telemetry.workspace = true
# The picker's ring placement (`assign_ring_seats`) — the same pure function
# `kaijutsu_client::rank` calls, taken directly because the picker also needs
# the horizon list that crate does not expose.
kaijutsu-viz.workspace = true
# The beat phasor (`WellBeats`) the status line's pulse and the beat timer
# read; `BeatRef`/`RefDisposition` decode the `ServerEvent::BeatSync` wire
# shape the same way the app's `time_well::live::ingest_live_events` does.
kaijutsu-audio.workspace = true

ratatui = { workspace = true }
crossterm = { workspace = true }
parking_lot = { workspace = true }
unicode-width = { workspace = true }

# `time` on top of the workspace set: the connect wait is bounded by a
# timeout and the redraw tick is a timer, and relying on another crate's
# feature unification for either would be a build that breaks the day this
# crate is compiled alone.
tokio = { workspace = true, features = ["time"] }
anyhow = { workspace = true }
clap = { workspace = true }
whoami = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Local-time wallclock stamps for the role divider. Already in the lock via
# schemars' chrono04 feature; taken as a direct dep rather than hand-rolling
# a timezone.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# `SIGTSTP` for `Ctrl+Z Ctrl+Z`. The inline viewport suspends the process the
# way a shell job does, so the raise is a real signal, not an emulation.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
