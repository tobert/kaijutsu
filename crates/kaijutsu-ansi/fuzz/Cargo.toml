[package]
name = "kaijutsu-ansi-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Stand-alone workspace root: without this, cargo walks up from `fuzz/` and
# finds the top-level kaijutsu workspace, whose explicit `members` list does
# not include this crate — "current package believes it's in a workspace
# when it's not". This stops the search here instead of joining that
# workspace (standard cargo-fuzz practice).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"

[dependencies.kaijutsu-ansi]
path = ".."

[[bin]]
name = "strip_totality"
path = "fuzz_targets/strip_totality.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunked_equivalence"
path = "fuzz_targets/chunked_equivalence.rs"
test = false
doc = false
bench = false
