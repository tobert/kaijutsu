[package]
name = "kaijutsu-kernel"
version.workspace = true
edition.workspace = true
description = "Core kernel with VFS abstraction for kaijutsu"

[dependencies]
# "process" — tokio::process::Command/Child for background host-process
# execution (background_exec.rs); the shell tool's synchronous path spawns
# through the embedded kaish interpreter instead and doesn't need this.
#
# rt-multi-thread + macros: needed only by src/bin/mcp_stub_server.rs (a
# minimal MCP stdio server used solely by this crate's own external-MCP
# reconcile tests as a real-handshake fixture — see that file's doc
# comment). Not exercised by the library itself.
tokio = { version = "1", features = ["fs", "sync", "time", "io-util", "process", "rt-multi-thread", "macros"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
dunce = { workspace = true }
regex = { workspace = true }
include_dir = { workspace = true }
clap = { workspace = true }

# CRDT
diamond-types-extended.workspace = true
kaijutsu-crdt.workspace = true
kaijutsu-types.workspace = true
kaijutsu-editor.workspace = true
kaijutsu-cas.workspace = true

# Audio render seam (docs/pcm.md) — AudioRef/AudioFormatHint for `kj play`.
kaijutsu-audio.workspace = true

# Hyoushigi — per-context timeline engine (the beat substrate)
kaijutsu-hyoushigi.workspace = true

# Concurrency
dashmap = { workspace = true }
parking_lot = { workspace = true }

# Persistence
rusqlite.workspace = true

# Enum string conversion
strum = { workspace = true }

# File watching
notify = "7"

# Config parsing
toml = { workspace = true }


# ABC music notation
kaijutsu-abc.workspace = true

# Diff model/dialect — `kj diff`, the `diff_block` tool, and the hydration
# projection all speak this crate's unified-diff dialect (docs/diff.md).
kaijutsu-diff.workspace = true

# SVG validation (kernel-side)
usvg = "0.46"

# File pattern matching
kaish-glob.workspace = true
kaish-kernel.workspace = true

# gitignore classification for Vfs.snapshot's `ignored` flag (docs/scenes/vfs.md)
ignore.workspace = true

# Semantic vector index (used by runtime/synthesis + kj_builtin)
kaijutsu-index = { path = "../kaijutsu-index" }

# Path expansion
shellexpand.workspace = true

# Async streams
futures = { workspace = true }
# vfs::pump / MountTable::open_read_stream delegation: lets the delegating
# override hold an owned Arc<dyn VfsOps> + relative PathBuf across an .await
# and yield through them, without hand-rolled unsafe self-referential Stream
# state (docs/slash-r.md slice 0).
async-stream = "0.3"

# Topic-partitioned pub/sub
async-broadcast = "0.7"

# MCP. "transport-io" (stdio()) is needed only by
# src/bin/mcp_stub_server.rs — see that file's doc comment.
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }

# JSON schema derivation for tool Params structs (Phase 1 tool redesign)
schemars = { version = "1.0", features = ["chrono04"] }

# CancellationToken for tool-call cancellation plumbing
tokio-util = { version = "0.7" }

# Telemetry — W3C trace context injection into CallContext
kaijutsu-telemetry.workspace = true

# Base64 (transitive dep via rmcp — zero new compiled code)
base64 = "0.22"

# Claude provider: HTTP + SSE streaming (Phase 2 unrig).
# Default features pull rustls + platform verifier (no OpenSSL).
reqwest = { version = "0.13", features = ["json", "stream"] }
eventsource-stream = "0.2"
bytes = "1"

# /r client shares (docs/slash-r.md): ShareFs plays the SFTP *client* role
# against a client's share server (russh-sftp's role swap).
russh-sftp.workspace = true

# `kj audio beats` — Beat This! (ISMIR 2024) beat/downbeat tracking, pure Rust
# (rten inference, symphonia decode, rubato resample). Default features only —
# the `ort` feature (external ONNX Runtime) is deliberately NOT enabled; rten
# is the same backend kaijutsu-index's embedder uses (both pinned to 0.24, no
# version skew between the two rten copies in the workspace).
beat-this = "1.0"

[features]
test-mock = []

# "process" — setpgid/kill_process_group/PR_SET_PDEATHSIG for background_exec.rs
# (own process group for group-kill semantics; parent-death signal so a
# spawned background process can never outlive a crashed/killed kernel).
[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", features = ["fs", "process"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
# Enable the cross-crate test-only helpers (e.g. push_committed_for_test) for the
# kernel's own tests — feature unification makes this dev-only.
kaijutsu-hyoushigi = { workspace = true, features = ["test-util"] }
